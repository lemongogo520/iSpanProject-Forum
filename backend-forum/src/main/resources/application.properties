spring.application.name=EquipmentTask

# port
############### port ############
server.port=8085

server.servlet.context-path=/
front.end.host=http://localhost:5173


spring.mvc.hiddenmethod.filter.enabled=true

######## file upload size limit ##########
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=80MB

######## datasource config ##########
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
######## datasource setting ==> application-local.properties ########
spring.profiles.active=local

######## JPA config ##########
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=

######## datasource auto generation ##########
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/InitAdmin.sql