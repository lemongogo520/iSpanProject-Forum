spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=iSpan_Project_Test;trustServerCertificate=true

spring.datasource.username=${COIN_TEST_DB_USERNAME}
spring.datasource.password=${COIN_TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

spring.datasource.hikari.maximum-pool-size=5

coin.test.account=${COIN_TEST_ACCOUNT}